<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review what I missed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f1ea;--surface:#fff;--surface-2:#ebe7db;--border:#d9d3c2;--ink:#1e231f;--ink-soft:#4d5449;--muted:#7a8072;--accent:#b1502e;--teal:#2f6a5e;--teal-soft:#dde9e4;--gold:#a9822c;--gold-soft:#f1e6c9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:36px 20px 70px}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:14px}.crumbs a{color:var(--accent);text-decoration:none}
h1{font-family:"Fraunces",Georgia,serif;font-size:32px;margin:0 0 6px}
.dek{color:var(--ink-soft);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.src{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--teal)}
.q{font-weight:600;margin:4px 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.b{border:1px dashed var(--border);border-radius:10px;background:var(--surface-2);padding:10px;text-align:center;cursor:pointer;font:inherit;color:var(--muted);min-height:58px}
.b.on{border-style:solid;background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.b b{display:block;font-size:14px}.b span{font-size:12px;color:var(--ink-soft)}
.f{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button.a{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer}
a.go{font-size:12.5px;color:var(--accent);align-self:center;margin-left:auto}
.empty{color:var(--ink-soft);padding:30px 0}
</style></head><body><main>
<div class="crumbs"><a href="../index.html">Semester 1</a> &rsaquo; Review</div>
<h1>Review what I missed</h1>
<p class="dek">Items you revealed but did not mark as known in a quick recall box. Say each one first, tap to check, then tap &ldquo;Got it&rdquo; to clear the card. This list lives in this browser only.</p>
<div id="list"></div>
<div class="f"><button class="a" id="clr">Clear all</button></div>
</main>
<script>
var KEY='yj_qr_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function draw(){
 var all=load(),ids=Object.keys(all).sort(function(a,b){return all[b].n-all[a].n}),L=document.getElementById('list');
 if(!ids.length){L.innerHTML='<p class="empty">Nothing to review. Use the Quick recall boxes at the end of the notes sections; the ones you miss will show up here.</p>';return}
 L.innerHTML='';
 ids.forEach(function(id){
  var c=all[id],d=document.createElement('div');d.className='card';
  var base=c.p.replace(/\/[^\/]*$/,'/');
  d.innerHTML='<div class="src">'+esc(c.t)+'</div><p class="q">'+esc(c.q)+'</p><div class="g"></div><div class="f"><button class="a" type="button">Got it</button><a class="go" href="'+esc(c.p)+'#'+esc(c.s)+'">Open section</a></div>';
  var g=d.querySelector('.g');
  c.m.forEach(function(it){var b=document.createElement('button');b.type='button';b.className='b';b.textContent='tap to reveal';
   b.onclick=function(){if(b.classList.contains('on')){b.classList.remove('on');b.textContent='tap to reveal'}else{b.classList.add('on');b.innerHTML='<b>'+esc(it[0])+'</b><span>'+esc(it[1]||'')+'</span>'}};g.appendChild(b)});
  d.querySelector('.a').onclick=function(){var o=load();delete o[id];save(o);draw()};
  L.appendChild(d)});
}
document.getElementById('clr').onclick=function(){if(confirm('Clear the whole review list?')){save({});draw()}};
draw();
</script></body></html>
